# Cloud voice IDs for each MC (VOICE=openrouter). One fixed ID per provider, or the voice changes every line.
# The section name is the character sheet's file name (freestyle/characters/<id>.toml). Restart the server
# after editing; ad-libs re-render for changed voices.
#
#   elevenlabs: used with TTS_MODEL=elevenlabs/eleven-v3 (the default)
#   fish:       used with TTS_MODEL=fish-audio/drama-3 (cheaper, faster). Copy an ID from a voice's page at
#               https://fish.audio/discovery (the 32-character ID in the voice's URL).
#               An MC with no fish ID falls back to one shared default voice.
#
# Avoid voices that impersonate real people or copyrighted characters.

